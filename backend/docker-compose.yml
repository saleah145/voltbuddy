services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: voltbuddy
      POSTGRES_USER: voltbuddy
      POSTGRES_PASSWORD: voltbuddy
    volumes:
      - voltbuddy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltbuddy -d voltbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://voltbuddy:voltbuddy@db:5432/voltbuddy
      EIA_API_KEY: ${EIA_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  voltbuddy_postgres_data:
